
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090B"/>
      <stop offset="1" stop-color="#171A20"/>
    </linearGradient>

    <!-- Silver Gradient -->
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B7280"/>
      <stop offset="0.5" stop-color="#D1D5DB"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>

    <!-- Silver Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28"
        fill="none"
        stroke="#30343B"
        stroke-width="1"/>
    </pattern>

    <!-- Clip -->
    <clipPath id="panelClip">
      <rect x="20" y="20" width="960" height="460" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#050607"/>

  <g clip-path="url(#panelClip)">

    <rect x="20" y="20" width="960" height="460" rx="18"
      fill="url(#bg)" stroke="#9CA3AF" stroke-width="2"/>

    <rect x="20" y="20" width="960" height="460"
      fill="url(#grid)" opacity=".55"/>

    <!-- Terminal Header -->
    <rect x="20" y="20" width="960" height="48"
      fill="#15171C" stroke="#9CA3AF" stroke-width="1"/>

    <!-- Terminal Buttons -->
    <circle cx="48" cy="44" r="7" fill="#6B7280"/>
    <circle cx="72" cy="44" r="7" fill="#D1D5DB"/>
    <circle cx="96" cy="44" r="7" fill="#9CA3AF"/>

    <!-- Terminal Title -->
    <text x="125" y="49"
      fill="#D1D5DB"
      font-family="monospace"
      font-size="18"
      font-weight="700">
      KHRESMUPU@github:~$ ./profile-scan --live
    </text>

    <!-- Left Panel -->
    <rect x="38" y="88" width="420" height="370" rx="12"
      fill="#101216" stroke="#9CA3AF" stroke-width="1.5"/>

    <text x="58" y="116"
      fill="#D1D5DB"
      font-family="monospace"
      font-size="14"
      font-weight="700">
      VISUAL.ID
    </text>

    <!-- ASCII Profile -->
    <g fill="#C4CBD4"
      font-family="monospace"
      font-size="13"
      text-anchor="middle"
      filter="url(#glow)">

      <text x="248" y="158">░░░░░░░░░░</text>
      <text x="248" y="172">░░██████████░░</text>
      <text x="248" y="186">░██████████████░</text>
      <text x="248" y="200">░████  ████  ████░</text>
      <text x="248" y="214">░██████████████████░</text>
      <text x="248" y="228">░████░░██████░░████░</text>
      <text x="248" y="242">░████████████████░</text>
      <text x="248" y="256">░░████████████░░</text>
      <text x="248" y="270">░██████████░</text>
      <text x="248" y="284">░░████░░</text>
    </g>

    <!-- Name -->
    <text x="248" y="325"
      fill="#F3F4F6"
      font-family="monospace"
      font-size="28"
      font-weight="800"
      text-anchor="middle">
      KHRESMUPU
    </text>

    <text x="248" y="350"
      fill="#BFC5CE"
      font-family="monospace"
      font-size="14"
      text-anchor="middle">
      CREATIVE DIGITAL EXPERIENCE
    </text>

    <!-- Animated Scan Line -->
    <rect x="42" y="120" width="412" height="3"
      fill="#D1D5DB" opacity=".85" filter="url(#glow)">
      <animate attributeName="y"
        values="120;445;120"
        dur="4s"
        repeatCount="indefinite"/>
    </rect>

    <!-- Progress -->
    <text x="58" y="422"
      fill="#C4CBD4"
      font-family="monospace"
      font-size="12">
      [████████████████████] 100%
    </text>

    <text x="58" y="443"
      fill="#9CA3AF"
      font-family="monospace"
      font-size="11">
      BIOMETRIC / PROFILE SIGNATURE VERIFIED
    </text>

    <!-- Right Information Panel -->
    <rect x="478" y="88" width="484" height="370" rx="12"
      fill="#101216" stroke="#9CA3AF" stroke-width="1.5"/>

    <text x="500" y="116"
      fill="#D1D5DB"
      font-family="monospace"
      font-size="14"
      font-weight="700">
      SYSTEM.INFO
    </text>

    <!-- Subject -->
    <text x="500" y="151" fill="#BFC5CE"
      font-family="monospace" font-size="15">Subject</text>
    <text x="670" y="151" fill="#F3F4F6"
      font-family="monospace" font-size="15">Khresna Mulia Putra</text>

    <!-- Handle -->
    <text x="500" y="181" fill="#BFC5CE"
      font-family="monospace" font-size="15">Handle</text>
    <text x="670" y="181" fill="#F3F4F6"
      font-family="monospace" font-size="15">khresmupu33</text>

    <!-- Role -->
    <text x="500" y="211" fill="#BFC5CE"
      font-family="monospace" font-size="15">Role</text>
    <text x="670" y="211" fill="#F3F4F6"
      font-family="monospace" font-size="15">Creative Developer</text>

    <!-- Status -->
    <text x="500" y="241" fill="#BFC5CE"
      font-family="monospace" font-size="15">Status</text>
    <text x="670" y="241" fill="#D1D5DB"
      font-family="monospace" font-size="15">● BUILDING / CREATING</text>

    <!-- Focus -->
    <text x="500" y="271" fill="#BFC5CE"
      font-family="monospace" font-size="15">Focus</text>
    <text x="670" y="271" fill="#F3F4F6"
      font-family="monospace" font-size="15">Web · 3D · UI/UX</text>

    <!-- Stack -->
    <text x="500" y="301" fill="#BFC5CE"
      font-family="monospace" font-size="15">Stack</text>
    <text x="670" y="301" fill="#F3F4F6"
      font-family="monospace" font-size="15">HTML CSS JS PHP SQL</text>

    <!-- Projects -->
    <text x="500" y="331" fill="#BFC5CE"
      font-family="monospace" font-size="15">Projects</text>
    <text x="670" y="331" fill="#F3F4F6"
      font-family="monospace" font-size="15">Tirta Sapa · Jogja Culture</text>

    <!-- Creative -->
    <text x="500" y="361" fill="#BFC5CE"
      font-family="monospace" font-size="15">Creative</text>
    <text x="670" y="361" fill="#F3F4F6"
      font-family="monospace" font-size="15">3D · Music · Technology</text>

    <!-- GitHub -->
    <text x="500" y="391" fill="#BFC5CE"
      font-family="monospace" font-size="15">GitHub</text>
    <text x="670" y="391" fill="#D1D5DB"
      font-family="monospace" font-size="15">github.com/khresmupu33</text>

    <!-- Signal -->
    <text x="500" y="431" fill="#BFC5CE"
      font-family="monospace" font-size="15">Signal</text>
    <text x="670" y="431" fill="#D1D5DB"
      font-family="monospace" font-size="15">ONLINE // READY</text>

    <!-- Decorative Circuits -->
    <path d="M500 135h130
             M500 195h90
             M500 255h130
             M500 315h90
             M500 375h130
             M500 435h90"
      stroke="#4B5563"
      fill="none"/>
  </g>

  <!-- Outer Border -->
  <rect x="20" y="20" width="960" height="460" rx="18"
    fill="none" stroke="#9CA3AF" stroke-width="2"/>
</svg>
