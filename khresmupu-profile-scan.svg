<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#0b1510"/>
    </linearGradient>

    <!-- Green -->
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff66"/>
      <stop offset="0.5" stop-color="#00cc55"/>
      <stop offset="1" stop-color="#00ff99"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path
        d="M 28 0 L 0 0 0 28"
        fill="none"
        stroke="#0d2b1b"
        stroke-width="1"
      />
    </pattern>

    <!-- Clip -->
    <clipPath id="panelClip">
      <rect
        x="20"
        y="20"
        width="960"
        height="460"
        rx="18"
      />
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1000"
    height="500"
    fill="#020403"
  />

  <g clip-path="url(#panelClip)">

    <rect
      x="20"
      y="20"
      width="960"
      height="460"
      rx="18"
      fill="url(#bg)"
      stroke="#00ff66"
      stroke-width="2"
    />

    <rect
      x="20"
      y="20"
      width="960"
      height="460"
      fill="url(#grid)"
      opacity=".55"
    />


    <!-- ================================================= -->
