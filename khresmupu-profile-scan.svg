    PHP · MySQL · Blender

  </text>


  <!-- Projects -->

  <text x="522"
        y="389"
        fill="#75ffa7"
        font-family="monospace"
        font-size="14">

    Projects

  </text>

  <text x="670"
        y="389"
        fill="#ffffff"
        font-family="monospace"
        font-size="13">

    Tirta Sapa

  </text>

  <text x="670"
        y="408"
        fill="#ffffff"
        font-family="monospace"
        font-size="13">

    Jogja Culture

  </text>

  <text x="670"
        y="427"
        fill="#ffffff"
        font-family="monospace"
        font-size="13">

    KasKeuangan

  </text>


  <!-- Creative -->

  <text x="522"
        y="461"
        fill="#75ffa7"
        font-family="monospace"
        font-size="14">

    Creative

  </text>

  <text x="670"
        y="461"
        fill="#ffffff"
        font-family="monospace"
        font-size="13">

    3D · Music · Technology

  </text>


  <!-- Signal -->

  <text x="522"
        y="495"
        fill="#75ffa7"
        font-family="monospace"
        font-size="14">

    Signal

  </text>

  <text x="670"
        y="495"
