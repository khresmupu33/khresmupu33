    ONLINE // READY

  </text>


  <!-- ================================================= -->
  <!-- DECORATIVE CIRCUITS -->
  <!-- ================================================= -->

  <path
    d="M520 145 H620
       M520 179 H590
       M520 213 H620
       M520 247 H590
       M520 281 H620
       M520 315 H590
       M520 370 H620
       M520 450 H590"
    stroke="#0d6338"
    stroke-width="1"
    fill="none"/>


  <!-- ================================================= -->
  <!-- OUTER BORDER -->
  <!-- ================================================= -->

  <rect x="18"
        y="18"
        width="964"
        height="524"
        rx="18"
        fill="none"
        stroke="#00ff66"
        stroke-width="2"/>

</svg>
