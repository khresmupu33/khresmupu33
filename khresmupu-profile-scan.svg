<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000"
     height="560"
     viewBox="0 0 1000 560">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020403"/>
      <stop offset="50%" stop-color="#07130c"/>
      <stop offset="100%" stop-color="#020604"/>
    </linearGradient>

    <!-- Green Photo Effect -->
    <filter id="greenPhoto"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

      <feColorMatrix type="matrix"
        values="
        0.15 0   0   0 0
        0    0.9 0   0 0.15
        0    0   0.35 0 0
        0    0   0   1 0"/>

      <feComponentTransfer>
        <feFuncR type="linear" slope="0.35"/>
        <feFuncG type="linear" slope="1.15"/>
        <feFuncB type="linear" slope="0.55"/>
      </feComponentTransfer>

    </filter>

    <!-- Glow -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="25"
             height="25"
             patternUnits="userSpaceOnUse">

      <path d="M 25 0 L 0 0 0 25"
            fill="none"
            stroke="#0b3d25"
            stroke-width="1"
            opacity="0.45"/>

    </pattern>

    <!-- Photo Clip -->
    <clipPath id="photoClip">
      <rect x="48"
            y="120"
            width="410"
            height="370"
            rx="10"/>
    </clipPath>

    <!-- Scan Lines -->
    <pattern id="scanlines"
             width="4"
             height="8"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="4"
            fill="#00ff66"
            opacity="0.07"/>

    </pattern>

  </defs>


  <!-- ================================================= -->
  <!-- MAIN BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1000"
        height="560"
        fill="#010201"/>

  <rect x="18"
        y="18"
        width="964"
        height="524"
        rx="18"
        fill="url(#bg)"
        stroke="#00ff66"
        stroke-width="2"/>

  <rect x="18"
        y="18"
        width="964"
        height="524"
        rx="18"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- TERMINAL HEADER -->
  <!-- ================================================= -->

  <rect x="18"
        y="18"
        width="964"
        height="52"
        rx="18"
        fill="#07110b"
        stroke="#00ff66"
        stroke-width="1"/>

  <!-- Hide bottom rounded corner -->
  <rect x="18"
        y="52"
        width="964"
        height="18"
        fill="#07110b"/>


  <!-- Terminal buttons -->

  <circle cx="48"
          cy="44"
          r="7"
          fill="#ff5050"/>

  <circle cx="72"
          cy="44"
          r="7"
          fill="#ffd34d"/>

  <circle cx="96"
          cy="44"
          r="7"
          fill="#00e86b"/>


  <text x="125"
        y="50"
        fill="#83ffad"
        font-family="monospace"
        font-size="17"
        font-weight="bold">

    KHRESMUPU@github:~$ ./profile-scan --live

  </text>


  <!-- ================================================= -->
  <!-- LEFT PHOTO PANEL -->
  <!-- ================================================= -->

  <rect x="35"
        y="92"
        width="445"
        height="430"
        rx="14"
        fill="#041009"
        stroke="#00ff66"
        stroke-width="1.5"/>


  <text x="55"
        y="118"
        fill="#46ff8d"
        font-family="monospace"
        font-size="14"
        font-weight="bold">

    VISUAL.ID

  </text>


  <!-- Photo -->

  <g clip-path="url(#photoClip)">

    <image
      href="2572032_Khresna%20%281%29.jpg"
      x="48"
      y="120"
      width="410"
      height="370"
      preserveAspectRatio="xMidYMid slice"
      filter="url(#greenPhoto)"/>

    <!-- Green overlay -->

    <rect x="48"
          y="120"
          width="410"
          height="370"
          fill="#00ff66"
          opacity="0.12"/>

    <!-- Scanline texture -->

    <rect x="48"
          y="120"
          width="410"
          height="370"
          fill="url(#scanlines)"/>

  </g>


  <!-- Photo border -->

  <rect x="48"
        y="120"
        width="410"
        height="370"
        rx="10"
        fill="none"
        stroke="#00ff66"
        stroke-width="2"
        filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- ANIMATED SCAN LINE -->
  <!-- ================================================= -->

  <rect x="48"
        y="120"
        width="410"
        height="4"
        fill="#00ff66"
        opacity="0.9"
        filter="url(#glow)">

    <animate
      attributeName="y"
      values="120;486;120"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Corner markers -->

  <path d="
      M48 145 V120 H73
      M433 120 H458 V145
      M48 465 V490 H73
      M433 490 H458 V465"
      fill="none"
      stroke="#00ff66"
      stroke-width="3"/>


  <!-- Photo status -->

  <text x="55"
        y="510"
        fill="#62ff9c"
        font-family="monospace"
        font-size="11">

    [████████████████████] 100%

  </text>


  <!-- ================================================= -->
  <!-- RIGHT SYSTEM PANEL -->
  <!-- ================================================= -->

  <rect x="500"
